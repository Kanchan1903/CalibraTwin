services:
  # Backend Web API on Render (using lightweight self-contained SQLite on Free Tier)
  - type: web
    name: calibratwin-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: "sqlite:///./calibratwin.db"
      - key: SECRET_KEY
        generateValue: true
      - key: MQTT_ENABLED
        value: "false"
